<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mis Cuentas</title>
<meta name="description" content="Anotá la plata que entra y sale, organizada en tus propias secciones.">
<meta name="theme-color" content="#0B1F3A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mis Cuentas">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Michroma&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout: barra de shell oscura tipo software corporativo, fila de indicadores, y dos columnas (lista + análisis) que pasan a una en el celular. */
:root{
  --bg:#F3F6FA; --surface:#FFFFFF; --surface-2:#F7F9FC; --fg:#0B1F3A; --muted:#5B6B7D; --line:#DDE3EA;
  --accent:#0070F2; --accent-weak:#DCE9F7; --accent-fg:#FFFFFF;
  --shell:#0B1F3A; --shell-fg:#FFFFFF; --shell-muted:#9DB7D8; --hero:#0B1F3A;
  --pos:#107E3E; --pos-weak:#E3F3E9; --neg:#BB2A2A; --neg-weak:#FBE7E7; --warn:#B45F00; --warn-weak:#FDF0DE;
  --shadow:0 1px 2px rgba(11,31,58,.06),0 2px 8px rgba(11,31,58,.05);
  --f-ui:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-brand:"Michroma","Inter",system-ui,sans-serif;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08121F; --surface:#0F1D30; --surface-2:#132539; --fg:#E4ECF6; --muted:#93A4B8; --line:#20354F;
  --accent:#4DA3FF; --accent-weak:#13304F; --accent-fg:#06121F;
  --shell:#050D18; --shell-fg:#FFFFFF; --shell-muted:#8FB4E0; --hero:#12345A;
  --pos:#4CC38A; --pos-weak:#123526; --neg:#FF7D7D; --neg-weak:#3A1A1E; --warn:#F2A64A; --warn-weak:#3A2A14;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#08121F; --surface:#0F1D30; --surface-2:#132539; --fg:#E4ECF6; --muted:#93A4B8; --line:#20354F;
  --accent:#4DA3FF; --accent-weak:#13304F; --accent-fg:#06121F;
  --shell:#050D18; --shell-fg:#FFFFFF; --shell-muted:#8FB4E0; --hero:#12345A;
  --pos:#4CC38A; --pos-weak:#123526; --neg:#FF7D7D; --neg-weak:#3A1A1E; --warn:#F2A64A; --warn-weak:#3A2A14;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark }

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font:15px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--shell)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Shell */
.shell{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--shell);color:var(--shell-fg)}
.shell .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand b{font:400 13px/1 var(--f-brand);letter-spacing:.08em;white-space:nowrap}
.sync{font-size:12px;color:var(--shell-muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--shell-muted)}
.sync.ok i{background:#4CC38A}
.sync.local i{background:#F2A64A}
.spacer{flex:1}
.btn{border:1px solid transparent;border-radius:var(--r);padding:8px 14px;min-height:44px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;background:var(--surface);border-color:var(--line);color:var(--fg)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.danger{color:var(--neg);border-color:var(--line);background:transparent}
.btn.danger.armed{background:var(--neg);color:#fff;border-color:var(--neg)}
.shell .btn.primary{background:#0070F2;border-color:#0070F2;color:#fff}

/* Mes */
.toolbar{background:var(--surface);border-bottom:1px solid var(--line)}
.toolbar .wrap{padding-block:8px}
.month{display:flex;align-items:center;gap:8px}
.month button{width:44px;height:44px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:20px}
.month span{flex:1;text-align:center;font-weight:600;font-size:16px;text-transform:capitalize}
/* Moneda */
.cur{display:inline-flex;border:1px solid rgba(255,255,255,.28);border-radius:999px;overflow:hidden}
.cur button{white-space:nowrap;border:0;background:transparent;color:var(--shell-muted);font-weight:600;font-size:13px;padding:0 14px;min-height:36px}
.cur button[aria-pressed="true"]{background:#0070F2;color:#fff}
.rate{display:flex;align-items:center;gap:8px;justify-content:space-between;background:var(--accent-weak);color:var(--fg);border-radius:var(--r);padding:6px 6px 6px 12px;margin-bottom:12px;font-size:13px}
/* Navegación inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .wrap{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center}
.tab{background:none;border:0;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:600;font-size:11px;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--accent)}
.fab{justify-self:center;width:56px;height:56px;border-radius:18px;border:0;background:#0070F2;color:#fff;box-shadow:0 6px 18px rgba(0,112,242,.4);display:grid;place-items:center;transform:translateY(-14px)}

main{padding-block:16px 120px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .v{font-size:19px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.in .v{color:var(--pos)} .kpi.out .v{color:var(--neg)}
.kpi.main,.kpi.wide{grid-column:1/-1}
.kpi.main .v{font-size:30px}
.kpi.main{background:var(--hero);border-color:var(--hero);color:var(--shell-fg)}
.kpi.main .eyebrow,.kpi.main .s{color:var(--shell-muted)}

.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:14px;font-weight:600;margin:0}
.panel-b{padding:14px 16px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}

/* Lista de movimientos */
.day{display:flex;justify-content:space-between;padding:8px 16px;background:var(--surface-2);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);font-weight:600}
.day:first-child{border-top:0}
.mov{min-height:60px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.mov:hover{background:var(--surface-2)}
.mov .ic{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff}
.mov .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mov .d{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mov .a{font-weight:700;white-space:nowrap}
.a.in{color:var(--pos)} .a.out{color:var(--fg)}
.list-end{padding:10px 16px;font-size:12px;color:var(--muted)}

/* Barras por sección */
.cat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:8px 0}
.cat+.cat{border-top:1px dashed var(--line)}
.cat .n{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.cat .n span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.cat .m{font-weight:600;text-align:right}
.track{grid-column:1/-1;height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;overflow:hidden;position:relative}
.track b{display:block;height:100%;border-radius:3px}
.cat .meta{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px}
.chip.warn{background:var(--warn-weak);color:var(--warn)}
.chip.bad{background:var(--neg-weak);color:var(--neg)}
.chip.good{background:var(--pos-weak);color:var(--pos)}

/* Gráfico 6 meses */
.trend{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;height:150px;align-items:end;padding-top:8px;border-bottom:1px solid var(--line);position:relative}
.trend .col{display:flex;gap:3px;align-items:end;justify-content:center;height:100%}
.trend .col i{width:min(16px,40%);border-radius:3px 3px 0 0;min-height:1px}
.trend .col.cur{background:linear-gradient(var(--accent-weak),transparent);border-radius:4px 4px 0 0}
.tlabels{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;font-size:11px;color:var(--muted);text-align:center;padding-top:6px;text-transform:capitalize}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* Filtros */
.filters{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:var(--surface);min-height:40px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-weak);color:var(--accent)}
.field{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:9px 10px;min-height:44px;font-size:16px;min-width:0}
.field:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-weak)}
.filters .field{flex:1 1 160px}

/* Secciones */
.secrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.secrow .sub{font-size:12px;color:var(--muted)}
.secgroup{padding:10px 16px 6px}

/* Estados vacíos */
.empty{padding:28px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty strong{color:var(--fg);font-size:15px}
.onb{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:12px 0 16px}
.onb label{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;cursor:pointer;background:var(--surface)}
.onb label:has(input:checked){border-color:var(--accent);background:var(--accent-weak)}
.onb small{color:var(--muted);margin-left:auto;font-size:11px}

/* Hoja (formulario) */
.scrim{position:fixed;inset:0;background:rgba(5,13,24,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border-radius:14px 14px 0 0;width:min(520px,100%);max-height:92%;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.sheet-h{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.sheet-h h3{margin:0;font-size:16px}
.sheet-b{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.sheet-f{display:flex;gap:8px;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface-2)}
.lbl{font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.amount{font-size:28px;font-weight:700;padding:10px 12px}
.seg.big{display:grid;grid-template-columns:1fr 1fr}
.seg.big button{padding:10px}
.seg.big button.out[aria-pressed="true"]{background:var(--neg-weak);color:var(--neg)}
.seg.big button.in[aria-pressed="true"]{background:var(--pos-weak);color:var(--pos)}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:40px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.pick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-weak);color:var(--accent);font-weight:600}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:36px;height:36px;border-radius:6px;border:2px solid transparent}
.swatches button[aria-pressed="true"]{border-color:var(--fg)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--neg);font-size:12px}
.note{font-size:12px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);white-space:nowrap;background:var(--shell);color:#fff;padding:10px 16px;border-radius:var(--r);font-size:13px;z-index:30;box-shadow:var(--shadow)}
.banner{background:var(--warn-weak);color:var(--warn);font-size:13px;padding:8px 12px;border-radius:var(--r);margin-bottom:12px}

.sync span,.secrow .hide-s{display:none}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .18s ease-out}
  @keyframes up{from{transform:translateY(12px);opacity:.6}to{transform:none;opacity:1}}
}

/* Ingreso */
body.out .toolbar,body.out .nav,body.out #app,body.out .cur,body.out #btnCuenta{display:none}
#auth{display:none}
body.out #auth{display:block}
.auth{padding-block:28px 40px;display:flex;flex-direction:column;gap:16px}
.auth h1{font-size:24px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.auth p{margin:0;color:var(--muted)}
.auth form{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.auth .btn{justify-content:center}
.auth .links{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.28);background:transparent;color:#fff;display:grid;place-items:center}
.ok{color:var(--pos);font-size:13px}
</style>
</head>

<script>
(function(){
const PALETA=['#0070F2','#16A085','#E67E22','#8E44AD','#D64545','#2C9AB7','#C9A227','#5D6D7E','#D6589A','#3E9B4F'];
const SUGERIDAS=[
  {nombre:'Sueldo',tipo:'ingreso',on:true},{nombre:'Trabajos extra',tipo:'ingreso',on:true},{nombre:'Otros ingresos',tipo:'ingreso',on:false},
  {nombre:'Comida',tipo:'gasto',on:true},{nombre:'Supermercado',tipo:'gasto',on:true},{nombre:'Transporte',tipo:'gasto',on:true},
  {nombre:'Servicios',tipo:'gasto',on:true},{nombre:'Salidas',tipo:'gasto',on:true},{nombre:'Ahorro',tipo:'gasto',on:true},
  {nombre:'Alquiler',tipo:'gasto',on:false},{nombre:'Salud',tipo:'gasto',on:false},{nombre:'Suscripciones',tipo:'gasto',on:false},
  {nombre:'Ropa',tipo:'gasto',on:false},{nombre:'Estudio',tipo:'gasto',on:false},{nombre:'Otros gastos',tipo:'gasto',on:true}
];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

const enUsd=()=>S.cfg.moneda==='USD'&&S.cfg.cotizacion>0;
const usd=(n,f)=>{const v=(n||0)/S.cfg.cotizacion;return (v<0?'-':'')+'US$ '+f.format(Math.abs(v))};
const money=n=>enUsd()?usd(n,fU):fmt.format(n||0), money0=n=>enUsd()?usd(n,fU0):fmt0.format(n||0);
const pad=n=>String(n).padStart(2,'0');

const ymLabel=ym=>{const [y,m]=ym.split('-').map(Number);return MESES[m-1]+' '+y};
function parseMonto(s){
  s=String(s||'').trim().replace(/[^\d.,-]/g,'');
  if(!s) return NaN;
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d+\.\d{1,2}$/.test(s)) {/* decimal con punto */}
  else s=s.replace(/\./g,'');
  return Math.round(parseFloat(s)*100)/100;
}

/* ---------- Almacenamiento ---------- */
function localStore(){
  const K='mc.datos.v1'; let data={movs:[],secs:null,cfg:null};
  try{const r=localStorage.getItem(K);if(r)data=JSON.parse(r)}catch(e){}
  const subM=[],subS=[];
  const save=()=>{try{localStorage.setItem(K,JSON.stringify(data))}catch(e){}};
  const emitM=()=>subM.forEach(f=>f(data.movs.slice(),{fromCache:false}));
  return {mode:'local',
    onMovs(cb){subM.push(cb);cb(data.movs.slice(),{fromCache:false})},
    onSecs(cb){subS.push(cb);cb(data.secs,{fromCache:false})},
    onCfg(cb){this._c=cb;cb(data.cfg)},
    async saveCfg(c){data.cfg=c;save();this._c&&this._c(c)},
    async saveMov(m){const i=data.movs.findIndex(x=>x.id===m.id);if(i>=0)data.movs[i]=m;else data.movs.push(m);save();emitM()},
    async deleteMov(id){data.movs=data.movs.filter(x=>x.id!==id);save();emitM()},
    async saveSecs(items){data.secs=items;save();subS.forEach(f=>f(items,{fromCache:false}))}
  };
}
function fireStore(fs,id){
  const base=fs.collection('usuarios').doc(id);
  const movCol=base.collection('movs'),secRef=base.collection('datos').doc('secciones'),cfgRef=base.collection('datos').doc('ajustes');
  const bg=p=>{p.catch(()=>toast('No se pudo guardar. Revisá la conexión.'));return Promise.resolve()};
  const opt={includeMetadataChanges:true};
  return {mode:'cloud',
    onMovs(cb,err){return movCol.orderBy('fecha','desc').limit(3000).onSnapshot(opt,s=>cb(s.docs.map(d=>Object.assign({id:d.id},d.data())),{fromCache:s.metadata.fromCache&&s.empty}),err)},
    onCfg(cb){return cfgRef.onSnapshot(s=>cb(s.exists?s.data():null),()=>{})},
    saveCfg(c){return bg(cfgRef.set(c))},
    onSecs(cb,err){return secRef.onSnapshot(opt,s=>cb(s.exists?((s.data()||{}).items||[]):null,{fromCache:s.metadata.fromCache&&!s.exists}),err)},
    saveMov(m){const o=Object.assign({},m);delete o.id;return bg(movCol.doc(m.id).set(o))},
    deleteMov(id){return bg(movCol.doc(id).delete())},
    saveSecs(items){return bg(secRef.set({items}))}
  };
}
let auth=null,cuentaMail='',modoAlta=false;
function abrir(st){
  store=st;S.mode=st.mode;document.body.classList.remove('out');
  const t=setTimeout(()=>{if(!S.movsReady||!S.secsReady){S.stale=true;render()}},10000);
  const fail=e=>{clearTimeout(t);S.movsReady=S.secsReady=true;S.error='No se pudieron leer tus datos ('+(e&&e.code||'error')+'). Recargá la página más tarde.';render()};
  store.onMovs((list,meta)=>{S.movs=list;if(!meta.fromCache){S.movsReady=true;S.stale=false;if(S.secsReady)clearTimeout(t)}render()},fail);
  store.onCfg(c=>{if(c)S.cfg={moneda:c.moneda==='USD'?'USD':'ARS',cotizacion:+c.cotizacion||0};render()});
  store.onSecs((items,meta)=>{S.secs=items;if(!meta.fromCache){S.secsReady=true;if(S.movsReady)clearTimeout(t)}render()},fail);
}
const AUTH_ERR={'auth/invalid-credential':'El mail o la contraseña no coinciden.','auth/wrong-password':'El mail o la contraseña no coinciden.','auth/user-not-found':'No hay una cuenta con ese mail. Creá una nueva.',
 'auth/email-already-in-use':'Ya existe una cuenta con ese mail. Probá ingresar.','auth/weak-password':'La contraseña tiene que tener al menos 6 caracteres.','auth/invalid-email':'Ese mail no parece válido.',
 'auth/missing-password':'Escribí tu contraseña.','auth/network-request-failed':'No hay conexión. Probá de nuevo en un rato.','auth/too-many-requests':'Demasiados intentos. Esperá unos minutos y probá de nuevo.',
 'auth/operation-not-allowed':'El ingreso por mail todavía no está activado en Firebase.'};
function setModo(alta){modoAlta=alta;
  document.getElementById('aTit').textContent=alta?'Creá tu cuenta':'Ingresá a tu cuenta';
  document.getElementById('aGo').textContent=alta?'Crear cuenta':'Ingresar';
  document.getElementById('aModo').textContent=alta?'Ya tengo cuenta':'Crear una cuenta nueva';
  document.getElementById('aPass').autocomplete=alta?'new-password':'current-password';
  document.getElementById('aOlvido').hidden=alta;document.getElementById('aErr').textContent='';document.getElementById('aOk').textContent='';
}
function conectar(){
  const cfg=window.FIREBASE_CONFIG;
  if(!cfg||!cfg.apiKey||/^PEGAR/.test(cfg.apiKey)||!window.firebase){S.demo=true;abrir(localStore());return}
  firebase.initializeApp(cfg);auth=firebase.auth();const fs=firebase.firestore();
  fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  let actual=null;
  auth.onAuthStateChanged(u=>{
    if(u){if(actual&&actual!==u.uid){location.reload();return}actual=u.uid;cuentaMail=u.email||'';abrir(fireStore(fs,u.uid))}
    else{if(actual){location.reload();return}document.body.classList.add('out')}
  });
  const err=document.getElementById('aErr'),ok=document.getElementById('aOk'),go=document.getElementById('aGo');
  document.getElementById('aModo').onclick=()=>setModo(!modoAlta);
  document.getElementById('fAuth').onsubmit=async ev=>{ev.preventDefault();err.textContent='';ok.textContent='';
    const mail=document.getElementById('aMail').value.trim(),pass=document.getElementById('aPass').value;
    if(!mail){err.textContent='Escribí tu mail.';return}
    if(pass.length<6){err.textContent='La contraseña tiene que tener al menos 6 caracteres.';return}
    go.disabled=true;
    try{if(modoAlta)await auth.createUserWithEmailAndPassword(mail,pass);else await auth.signInWithEmailAndPassword(mail,pass)}
    catch(e){err.textContent=AUTH_ERR[e.code]||'No se pudo ingresar. Probá de nuevo.'}
    go.disabled=false};
  document.getElementById('aOlvido').onclick=async()=>{err.textContent='';ok.textContent='';
    const mail=document.getElementById('aMail').value.trim();
    if(!mail){err.textContent='Escribí tu mail arriba y volvé a tocar acá.';return}
    try{await auth.sendPasswordResetEmail(mail);ok.textContent='Si hay una cuenta con ese mail, te llega un correo para cambiar la contraseña.'}
    catch(e){err.textContent=AUTH_ERR[e.code]||'No se pudo enviar el correo.'}};
}

/* ---------- Cálculos ---------- */
const secById=id=>(S.secs||[]).find(s=>s.id===id);
const secName=id=>{const s=secById(id);return s?s.nombre:'Sin sección'};
const secColor=id=>{const s=secById(id);return s?s.color:'#8A99AB'};
function delMes(ym){return S.movs.filter(m=>m.fecha&&m.fecha.slice(0,7)===ym)}
function totales(list){let i=0,g=0;list.forEach(m=>{if(m.tipo==='ingreso')i+=m.monto;else g+=m.monto});return {i,g,b:i-g}}
function saldoHasta(ym){let b=0;S.movs.forEach(m=>{if(m.fecha.slice(0,7)<=ym)b+=m.tipo==='ingreso'?m.monto:-m.monto});return b}

/* ---------- Render ---------- */
const app=document.getElementById('app');
function render(){
  document.getElementById('mLbl').textContent=ymLabel(S.ym);
  document.querySelectorAll('.tab[data-view]').forEach(b=>b.setAttribute('aria-selected',b.dataset.view===S.view));
  document.getElementById('curARS').setAttribute('aria-pressed',!enUsd());document.getElementById('curUSD').setAttribute('aria-pressed',enUsd());
  let h='';
  if(S.demo) h+='<div class="banner">Modo de prueba: todavía no está conectada la base de datos, así que lo que cargues queda solo en este navegador.</div>';
  if(S.error) h+='<div class="banner">'+esc(S.error)+'</div>';
  else if(S.stale) h+='<div class="banner">Todavía no pudimos traer tus datos. Revisá la conexión; lo que veas puede no estar actualizado.</div>';
  if(!S.movsReady||!S.secsReady){ if(!S.movs.length){app.innerHTML=h+'<div class="panel"><div class="empty"><strong>Cargando tus cuentas…</strong></div></div>';return} }
  if(S.secsReady&&S.secs===null&&!S.error){app.innerHTML=h+vOnboarding();return}
  if(S.view==='movimientos')h+=vMovimientos();
  else if(S.view==='secciones')h+=vSecciones();
  else h+=vResumen();
  app.innerHTML=h;
}

function vKpis(){
  const t=totales(delMes(S.ym)), saldo=saldoHasta(S.ym);
  const prev=totales(delMes(ymShift(S.ym,-1)));
  let comp='';
  if(prev.g>0){const d=(t.g-prev.g)/prev.g*100;comp=(d>=0?'+':'')+d.toFixed(0)+'% vs. mes anterior'}else comp='Sin datos del mes anterior';
  const ahorro=t.i>0?Math.round(t.b/t.i*100):null;
  return (enUsd()?'<div class="rate"><span class="num">Convertido a US$ 1 = '+fmt.format(S.cfg.cotizacion)+'</span><button class="btn ghost" data-rate="1">Cambiar</button></div>':'')+'<div class="kpis">'+
   '<div class="kpi main"><div class="eyebrow">Plata disponible</div><div class="v num">'+money(saldo)+'</div><div class="s">Saldo acumulado a fin de '+esc(ymLabel(S.ym).split(' ')[0])+'</div></div>'+
   '<div class="kpi in"><div class="eyebrow">Entró este mes</div><div class="v num">'+money(t.i)+'</div><div class="s">'+delMes(S.ym).filter(m=>m.tipo==='ingreso').length+' ingresos</div></div>'+
   '<div class="kpi out"><div class="eyebrow">Salió este mes</div><div class="v num">'+money(t.g)+'</div><div class="s">'+comp+'</div></div>'+
   '<div class="kpi wide"><div class="eyebrow">Balance del mes</div><div class="v num" style="color:'+(t.b>=0?'var(--pos)':'var(--neg)')+'">'+(t.b>0?'+':'')+money(t.b)+'</div><div class="s">'+(ahorro===null?'Cargá un ingreso para ver tu tasa de ahorro':(ahorro>=0?'Te quedó el '+ahorro+'% de lo que entró':'Saliste '+(-ahorro)+'% por encima de lo que entró'))+'</div></div>'+
  '</div>';
}

function vResumen(){
  const mes=delMes(S.ym);
  const recientes=mes.slice().sort(ordenMov).slice(0,6);
  return vKpis()+'<div class="grid"><div class="stack">'+
    '<section class="panel"><div class="panel-h"><h2>Gastos por sección</h2><div class="spacer"></div><span class="note">'+esc(ymLabel(S.ym))+'</span></div><div class="panel-b">'+vCats('gasto')+'</div></section>'+

   '</div><div class="stack">'+

}

function vCats(tipo){
  const mes=delMes(S.ym).filter(m=>m.tipo===tipo);
  const tot=mes.reduce((a,m)=>a+m.monto,0);
  const by={};mes.forEach(m=>{by[m.seccion||'']=(by[m.seccion||'']||0)+m.monto});
  const secs=(S.secs||[]).filter(s=>s.tipo===tipo);
  const rows=secs.map(s=>({id:s.id,n:s.nombre,c:s.color,v:by[s.id]||0,p:s.presupuesto||0}));
  Object.keys(by).forEach(k=>{if(!secs.find(s=>s.id===k))rows.push({id:k,n:secName(k),c:secColor(k),v:by[k],p:0})});
  const vis=rows.filter(r=>r.v>0||r.p>0).sort((a,b)=>b.v-a.v);
  if(!vis.length) return '<div class="empty" style="padding:12px"><span>'+(tipo==='gasto'?'No hay gastos cargados en este mes.':'No hay ingresos cargados en este mes.')+'</span></div>';
  const max=Math.max(...vis.map(r=>Math.max(r.v,r.p)));
  return vis.map(r=>{
    let meta,chip='';
    if(r.p>0){
      const pct=r.v/r.p*100;
      meta='<span class="num">'+money0(r.v)+' de '+money0(r.p)+'</span>';
      chip=pct>100?'<span class="chip bad">Pasado '+money0(r.v-r.p)+'</span>':pct>=85?'<span class="chip warn">Queda '+money0(r.p-r.v)+'</span>':'<span class="chip good">Queda '+money0(r.p-r.v)+'</span>';
      const w=Math.min(100,pct);
      return '<div class="cat"><div class="n"><i class="dot" style="background:'+r.c+'"></i><span>'+esc(r.n)+'</span></div><div class="m num">'+money(r.v)+'</div>'+
        '<div class="track"><b style="width:'+w+'%;background:'+(pct>100?'var(--neg)':r.c)+'"></b></div><div class="meta">'+meta+chip+'</div></div>';
    }
    const share=tot?Math.round(r.v/tot*100):0;
    return '<div class="cat"><div class="n"><i class="dot" style="background:'+r.c+'"></i><span>'+esc(r.n)+'</span></div><div class="m num">'+money(r.v)+'</div>'+
      '<div class="track"><b style="width:'+(r.v/max*100)+'%;background:'+r.c+'"></b></div><div class="meta"><span>'+share+'% del total</span><span></span></div></div>';
  }).join('');
}

function vTrend(){
  const meses=[];for(let k=5;k>=0;k--)meses.push(ymShift(S.ym,-k));
  const data=meses.map(ym=>Object.assign({ym},totales(delMes(ym))));
  const max=Math.max(1,...data.map(d=>Math.max(d.i,d.g)));
  return '<div class="legend"><span><i class="dot" style="background:var(--pos)"></i>Entró</span><span><i class="dot" style="background:var(--neg)"></i>Salió</span><span class="note" style="margin-left:auto">Máx. '+money0(max)+'</span></div>'+
   '<div class="trend">'+data.map(d=>'<div class="col'+(d.ym===S.ym?' cur':'')+'" title="'+esc(ymLabel(d.ym))+': entró '+money(d.i)+', salió '+money(d.g)+'">'+
     '<i style="height:'+(d.i/max*100)+'%;background:var(--pos)"></i><i style="height:'+(d.g/max*100)+'%;background:var(--neg)"></i></div>').join('')+'</div>'+
   '<div class="tlabels">'+data.map(d=>'<span>'+MESES[+d.ym.slice(5)-1].slice(0,3)+'</span>').join('')+'</div>';
}

const ordenMov=(a,b)=>a.fecha<b.fecha?1:a.fecha>b.fecha?-1:(b.creado||0)-(a.creado||0);
function vLista(list,agrupar){

  let h='',dia='',grupo=[];
  const flush=()=>{if(!grupo.length)return;const t=totales(grupo);const d=new Date(dia+'T12:00:00');
    h+='<div class="day"><span>'+DIAS[d.getDay()]+' '+d.getDate()+' de '+MESES[d.getMonth()]+'</span><span class="num">'+(t.b>=0?'+':'')+money(t.b)+'</span></div>'+grupo.map(vMov).join('');grupo=[]};
  list.forEach(m=>{if(m.fecha!==dia){flush();dia=m.fecha}grupo.push(m)});flush();
  return h;
}

function vSecciones(){
  const mes=delMes(S.ym);
  const grupo=(tipo,titulo)=>{
    const secs=(S.secs||[]).filter(s=>s.tipo===tipo);
    return '<div class="secgroup eyebrow">'+titulo+'</div>'+(secs.length?secs.map(s=>{
      const tot=mes.filter(m=>m.seccion===s.id).reduce((a,m)=>a+m.monto,0);
      const cant=S.movs.filter(m=>m.seccion===s.id).length;
      return '<div class="secrow"><i class="dot" style="background:'+s.color+';width:14px;height:14px"></i>'+
        '<div style="min-width:0"><div style="font-weight:600">'+esc(s.nombre)+'</div><div class="sub">'+cant+' movimientos en total'+(s.presupuesto?' · tope mensual '+money0(s.presupuesto):'')+'</div></div>'+
        '<div class="num hide-s" style="font-weight:600">'+money(tot)+'</div>'+
        '<button class="btn" data-esec="'+esc(s.id)+'">Editar</button></div>';
    }).join(''):'<div class="secrow"><span></span><span class="sub">No tenés secciones de este tipo.</span></div>');
  };
  return '<section class="panel"><div class="panel-h"><h2>Tus secciones</h2><div class="spacer"></div><button class="btn primary" data-nsec="1">+ Nueva sección</button></div>'+
    grupo('ingreso','Entradas de plata')+grupo('gasto','Salidas de plata')+
    '<div class="panel-b note">Una sección agrupa tus movimientos (por ejemplo “Comida” o “Sueldo”). A las de salida les podés poner un tope mensual y el resumen te avisa cuando te acercás o lo pasás. El monto de la derecha es de '+esc(ymLabel(S.ym))+'.</div></section>';
}

function vOnboarding(){
  return '<section class="panel" style="max-width:760px;margin:0 auto"><div class="panel-h"><h2>Arranquemos: elegí tus secciones</h2></div><div class="panel-b">'+
    '<p style="margin:0">Las secciones son los apartados donde vas a anotar la plata. Marcá las que te sirvan; después podés renombrarlas, borrarlas o crear otras.</p>'+
    '<div class="onb">'+SUGERIDAS.map((s,i)=>'<label><input type="checkbox" id="sug'+i+'" data-sug="'+i+'"'+(s.on?' checked':'')+'> '+esc(s.nombre)+'<small>'+(s.tipo==='ingreso'?'entrada':'salida')+'</small></label>').join('')+'</div>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="btnOnb">Crear secciones</button><button class="btn" id="btnOnbVacio">Empezar sin ninguna</button></div></div></section>';
}

/* ---------- Hojas ---------- */
const layer=document.getElementById('layer');
function cerrar(){layer.innerHTML=''}
function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2200)}

function hojaMov(m){
  const ed=!!m; m=m?Object.assign({},m):{id:uid(),tipo:'gasto',monto:'',seccion:'',fecha:hoy(),nota:''};
  if(!ed&&S.ym!==hoy().slice(0,7))m.fecha=S.ym+'-01';
  let armed=false;
  const draw=()=>{
    const secs=(S.secs||[]).filter(s=>s.tipo===m.tipo);
    layer.innerHTML='<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="hMov"><div class="sheet-h"><h3 id="hMov">'+(ed?'Editar movimiento':'Nuevo movimiento')+'</h3><div class="spacer"></div><button class="btn ghost" data-close="1" aria-label="Cerrar">✕</button></div>'+
    '<form class="sheet-b" id="fMov"><div class="seg big"><button type="button" class="out" data-tipo="gasto" aria-pressed="'+(m.tipo==='gasto')+'">− Salió plata</button><button type="button" class="in" data-tipo="ingreso" aria-pressed="'+(m.tipo==='ingreso')+'">+ Entró plata</button></div>'+
    '<label class="lbl">Monto en pesos<input class="field amount num" id="iMonto" inputmode="decimal" autocomplete="off" placeholder="0,00" value="'+esc(typeof m.monto==='number'?String(m.monto).replace('.',','):m.monto)+'"></label>'+
    '<div class="lbl">Sección<div class="pick">'+(secs.length?secs.map(s=>'<button type="button" data-sec="'+esc(s.id)+'" aria-pressed="'+(m.seccion===s.id)+'"><i class="dot" style="background:'+s.color+'"></i>'+esc(s.nombre)+'</button>').join(''):'<span class="note">No tenés secciones de '+(m.tipo==='gasto'?'salida':'entrada')+'. Creá una desde la pestaña Secciones.</span>')+'</div></div>'+
    '<div class="row2"><label class="lbl">Fecha<input class="field" type="date" id="iFecha" value="'+esc(m.fecha)+'"></label>'+
    '<label class="lbl">Nota (opcional)<input class="field" id="iNota" maxlength="80" placeholder="Ej: almuerzo con amigos" value="'+esc(m.nota)+'"></label></div>'+
    '<div class="err" id="eMov"></div><button type="submit" hidden></button></form>'+
    '<div class="sheet-f">'+(ed?'<button class="btn danger'+(armed?' armed':'')+'" id="bDel" type="button">'+(armed?'Tocá de nuevo para borrar':'Borrar')+'</button>':'')+'<div class="spacer"></div><button class="btn" data-close="1" type="button">Cancelar</button><button class="btn primary" id="bSave" type="button">Guardar</button></div></div></div>';
    const keep=()=>{m.monto=document.getElementById('iMonto').value;m.fecha=document.getElementById('iFecha').value;m.nota=document.getElementById('iNota').value};
    layer.querySelectorAll('[data-tipo]').forEach(b=>b.onclick=()=>{keep();if(m.tipo!==b.dataset.tipo){m.tipo=b.dataset.tipo;m.seccion=''}draw()});
    layer.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{keep();m.seccion=b.dataset.sec;draw()});
    const del=document.getElementById('bDel');
    if(del)del.onclick=async()=>{if(!armed){keep();armed=true;draw();return}
      try{await store.deleteMov(m.id);cerrar();toast('Movimiento borrado')}catch(e){document.getElementById('eMov').textContent='No se pudo borrar. Probá de nuevo.'}};
    const save=async()=>{keep();const v=parseMonto(m.monto),e=document.getElementById('eMov');
      if(!(v>0)){e.textContent='Escribí un monto mayor a cero, por ejemplo 1500 o 1.500,50.';return}
      if(!/^\d{4}-\d{2}-\d{2}$/.test(m.fecha)){e.textContent='Elegí una fecha.';return}
      const doc={id:m.id,tipo:m.tipo,monto:v,seccion:m.seccion||'',fecha:m.fecha,nota:(m.nota||'').trim(),creado:m.creado||Date.now()};
      document.getElementById('bSave').disabled=true;
      try{await store.saveMov(doc);cerrar();toast(ed?'Cambios guardados':'Movimiento guardado');if(!ed&&m.fecha.slice(0,7)!==S.ym){S.ym=m.fecha.slice(0,7);render()}}
      catch(err){document.getElementById('bSave').disabled=false;e.textContent=err&&err.code==='quota_exceeded'?'Se llenó el espacio de guardado. Borrá movimientos viejos para seguir.':'No se pudo guardar. Revisá la conexión y probá de nuevo.'}};
    document.getElementById('bSave').onclick=save;
    document.getElementById('fMov').onsubmit=ev=>{ev.preventDefault();save()};
    if(!ed&&!m.monto){const i=document.getElementById('iMonto');try{i.focus({preventScroll:true})}catch(e){}}
  };
  draw();
}

function hojaSec(s){
  const ed=!!s; s=s?Object.assign({},s):{id:uid(),nombre:'',tipo:'gasto',color:PALETA[(S.secs||[]).length%PALETA.length],presupuesto:0};
  let armed=false;
  const draw=()=>{
    const usados=S.movs.filter(m=>m.seccion===s.id).length;
    layer.innerHTML='<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="hSec"><div class="sheet-h"><h3 id="hSec">'+(ed?'Editar sección':'Nueva sección')+'</h3><div class="spacer"></div><button class="btn ghost" data-close="1" aria-label="Cerrar">✕</button></div>'+
    '<form class="sheet-b" id="fSecF"><label class="lbl">Nombre<input class="field" id="sNom" maxlength="30" placeholder="Ej: Gimnasio" value="'+esc(s.nombre)+'"></label>'+
    '<div class="lbl">Tipo<div class="seg big"><button type="button" class="out" data-st="gasto" aria-pressed="'+(s.tipo==='gasto')+'">Salida de plata</button><button type="button" class="in" data-st="ingreso" aria-pressed="'+(s.tipo==='ingreso')+'">Entrada de plata</button></div></div>'+
    '<div class="lbl">Color<div class="swatches">'+PALETA.map(c=>'<button type="button" data-col="'+c+'" style="background:'+c+'" aria-label="Color '+c+'" aria-pressed="'+(s.color===c)+'"></button>').join('')+'</div></div>'+
    (s.tipo==='gasto'?'<label class="lbl">Tope mensual (opcional)<input class="field num" id="sPres" inputmode="decimal" placeholder="Sin tope" value="'+esc(typeof s.presupuesto==='number'?(s.presupuesto?String(s.presupuesto).replace('.',','):''):(s.presupuesto||''))+'"></label><span class="note">Si ponés un tope, el resumen te muestra cuánto te queda en el mes.</span>':'')+
    '<div class="err" id="eSec"></div><button type="submit" hidden></button></form>'+
    '<div class="sheet-f">'+(ed?'<button class="btn danger'+(armed?' armed':'')+'" id="sDel" type="button">'+(armed?'Confirmar borrado':'Borrar')+'</button>':'')+'<div class="spacer"></div><button class="btn" data-close="1" type="button">Cancelar</button><button class="btn primary" id="sSave" type="button">Guardar</button></div>'+
    (ed&&armed&&usados?'<div class="panel-b note" style="border-top:1px solid var(--line)">'+usados+' movimientos usan esta sección. No se borran: quedan como “Sin sección”.</div>':'')+'</div></div>';
    const keep=()=>{s.nombre=document.getElementById('sNom').value;const p=document.getElementById('sPres');if(p)s.presupuesto=p.value};
    layer.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{keep();s.tipo=b.dataset.st;draw()});
    layer.querySelectorAll('[data-col]').forEach(b=>b.onclick=()=>{keep();s.color=b.dataset.col;draw()});
    const del=document.getElementById('sDel');
    if(del)del.onclick=async()=>{if(!armed){keep();armed=true;draw();return}
      try{await store.saveSecs((S.secs||[]).filter(x=>x.id!==s.id));cerrar();toast('Sección borrada')}catch(e){document.getElementById('eSec').textContent='No se pudo borrar. Probá de nuevo.'}};
    const save=async()=>{keep();const e=document.getElementById('eSec');const nom=s.nombre.trim();
      if(!nom){e.textContent='Ponele un nombre.';return}
      if((S.secs||[]).some(x=>x.id!==s.id&&x.tipo===s.tipo&&x.nombre.toLowerCase()===nom.toLowerCase())){e.textContent='Ya tenés una sección con ese nombre.';return}
      let p=0;if(s.tipo==='gasto'&&String(s.presupuesto||'').trim()){p=parseMonto(s.presupuesto);if(!(p>=0)){e.textContent='El tope tiene que ser un número, por ejemplo 80000.';return}}
      const item={id:s.id,nombre:nom,tipo:s.tipo,color:s.color,presupuesto:s.tipo==='gasto'?p:0};
      const list=(S.secs||[]).slice();const i=list.findIndex(x=>x.id===s.id);if(i>=0)list[i]=item;else list.push(item);
      try{await store.saveSecs(list);cerrar();toast(ed?'Sección actualizada':'Sección creada')}catch(err){e.textContent='No se pudo guardar. Revisá la conexión y probá de nuevo.'}};
    document.getElementById('sSave').onclick=save;
    document.getElementById('fSecF').onsubmit=ev=>{ev.preventDefault();save()};
  };
  draw();
}

function hojaDolar(activar){
  if(!store)return;
  const v=S.cfg.cotizacion?String(S.cfg.cotizacion).replace('.',','):'';
  layer.innerHTML='<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="hDol"><div class="sheet-h"><h3 id="hDol">Cotización del dólar</h3><div class="spacer"></div><button class="btn ghost" data-close="1" aria-label="Cerrar">✕</button></div>'+
   '<form class="sheet-b" id="fDol"><label class="lbl">¿A cuántos pesos está 1 dólar?<input class="field amount num" id="iCot" inputmode="decimal" autocomplete="off" placeholder="Ej: 1.450" value="'+esc(v)+'"></label>'+
   '<div class="rate" id="dPrev" style="flex-direction:column;align-items:stretch;gap:2px;margin:0;padding:10px 12px"></div>'+
   '<span class="note">Tus movimientos se guardan siempre en pesos. Al pasar a US$, la app divide todos los montos por esta cotización, también los de meses anteriores. Usá la que vos tomes como referencia (blue, MEP u oficial) y actualizala cuando cambie.</span>'+
   '<div class="err" id="eDol"></div><button type="submit" hidden></button></form>'+
   '<div class="sheet-f"><div class="spacer"></div><button class="btn" data-close="1" type="button">Cancelar</button><button class="btn primary" id="bDol" type="button">'+'Ver todo en US$'+'</button></div></div></div>';
  const save=async()=>{const n=parseMonto(document.getElementById('iCot').value),e=document.getElementById('eDol');
    if(!(n>0)){e.textContent='Escribí cuántos pesos vale un dólar, por ejemplo 1450.';return}
    try{await store.saveCfg({moneda:'USD',cotizacion:n});S.cfg={moneda:'USD',cotizacion:n};cerrar();render();toast('Mostrando todo en dólares')}catch(err){e.textContent='No se pudo guardar. Probá de nuevo.'}};
  document.getElementById('bDol').onclick=save;
  document.getElementById('fDol').onsubmit=ev=>{ev.preventDefault();save()};
  const i=document.getElementById('iCot');
  const prev=()=>{const n=parseMonto(i.value),box=document.getElementById('dPrev'),saldo=saldoHasta(S.ym),t=totales(delMes(S.ym));
    const u=x=>(x<0?'-':'')+'US$ '+fU.format(Math.abs(x)/n);
    box.innerHTML=n>0?'<span class="eyebrow">Con este dólar</span><span class="num"><b>'+fmt.format(saldo)+'</b> disponibles = <b>'+u(saldo)+'</b></span><span class="num note">Este mes entró '+u(t.i)+' y salió '+u(t.g)+'</span>'
      :'<span class="note">Escribí la cotización y acá ves al toque cuánto es tu plata en dólares.</span>'};
  i.addEventListener('input',prev);prev();
  try{i.focus({preventScroll:true})}catch(e){}
}
async function setMoneda(c){
  if(!store)return;
  if(c==='USD'&&!(S.cfg.cotizacion>0)){hojaDolar(true);return}
  if(c===S.cfg.moneda)return;
  try{await store.saveCfg({moneda:c,cotizacion:S.cfg.cotizacion})}catch(e){toast('No se pudo cambiar la moneda.')}
}
/* ---------- Eventos ---------- */
document.querySelectorAll('[data-cur]').forEach(b=>b.onclick=()=>setMoneda(b.dataset.cur));
document.getElementById('tab-dolar').onclick=()=>hojaDolar(false);
document.getElementById('btnCuenta').onclick=hojaCuenta;
function nuevo(){if(!store)return;hojaMov(null)}
document.getElementById('fab').onclick=nuevo;
document.getElementById('mPrev').onclick=()=>{S.ym=ymShift(S.ym,-1);render()};
document.getElementById('mNext').onclick=()=>{S.ym=ymShift(S.ym,1);render()};
document.querySelectorAll('.tab[data-view]').forEach(b=>b.onclick=()=>{S.view=b.dataset.view;pref('view',S.view);render();window.scrollTo(0,0)});
layer.addEventListener('click',e=>{if(e.target.id==='scrim'||e.target.closest('[data-close]'))cerrar()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&layer.innerHTML)cerrar()});
app.addEventListener('click',async e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.edit){const m=S.movs.find(x=>x.id===t.dataset.edit);if(m)hojaMov(m)}
  else if(t.dataset.new)nuevo();
  else if(t.dataset.rate)hojaDolar(false);
  else if(t.dataset.go){S.view=t.dataset.go;pref('view',S.view);render()}
  else if(t.dataset.ftipo){S.fTipo=t.dataset.ftipo;render()}
  else if(t.dataset.esec){hojaSec(secById(t.dataset.esec))}
  else if(t.dataset.nsec){hojaSec(null)}
  else if(t.id==='btnOnb'||t.id==='btnOnbVacio'){
    const items=[];if(t.id==='btnOnb')app.querySelectorAll('[data-sug]').forEach(c=>{if(c.checked){const s=SUGERIDAS[+c.dataset.sug];items.push({id:uid(),nombre:s.nombre,tipo:s.tipo,color:PALETA[items.length%PALETA.length],presupuesto:0})}});
    t.disabled=true;try{await store.saveSecs(items);toast('Listo, ya podés cargar movimientos')}catch(err){t.disabled=false;toast('No se pudo guardar. Probá de nuevo.')}
  }
  else if(t.id==='btnCsv'&&downloads){
    const rows=[['fecha','tipo','seccion','monto','nota']].concat(S.movs.slice().sort((a,b)=>a.fecha<b.fecha?-1:1).map(m=>[m.fecha,m.tipo,secName(m.seccion),String(m.monto).replace('.',','),m.nota||'']));
    const csv='﻿'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\r\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='mis-cuentas-'+hoy()+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  }
});
app.addEventListener('change',e=>{if(e.target.id==='fSec'){S.fSec=e.target.value;render()}});
let qT;app.addEventListener('input',e=>{if(e.target.id==='fQ'){clearTimeout(qT);qT=setTimeout(()=>{S.q=e.target.value;const pos=e.target.selectionStart;render();const i=document.getElementById('fQ');if(i){i.focus();try{i.setSelectionRange(pos,pos)}catch(_){}}},200)}});

render();
conectar();
})();
</script>
